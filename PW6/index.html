<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Системи аварійного електропостачання</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    table { border-collapse: collapse; width: 100%; margin-top: 20px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; cursor: pointer; }
    th { background: #eee; }
    form { margin-top: 20px; }
    input, select { margin-right: 10px; }
    button { margin-right: 5px; }
    .section { margin-top: 30px; padding: 10px; border: 1px solid #aaa; }
    #swagger-ui { margin-top: 20px; }
  </style>

  <!-- Swagger UI CSS -->
  <link rel="stylesheet" type="text/css" href="https://unpkg.com/swagger-ui-dist/swagger-ui.css" />
</head>
<body>
  <h1>Системи аварійного електропостачання</h1>

  <!-- Форма для створення системи -->
  <form id="createForm" onsubmit="return false;">
    <input type="text" id="name" placeholder="Назва" required>
    <select id="source">
      <option value="Зелена електрика">Зелена електрика</option>
      <option value="Теплова (ТЕЦ)">Теплова (ТЕЦ)</option>
    </select>
    <select id="state">
      <option value="Стабільний">Стабільний</option>
      <option value="Критичний">Критичний</option>
      <option value="Аварійний">Аварійний</option>
    </select>
    <button id="addBtn">Додати систему</button>
  </form>

  <!-- Таблиця -->
  <table id="systemsTable">
    <thead>
      <tr>
        <th onclick="sortTable('id')">ID</th>
        <th onclick="sortTable('name')">Назва</th>
        <th onclick="sortTable('source')">Джерело</th>
        <th onclick="sortTable('state')">Стан</th>
        <th>Дії</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <!-- Блок користувача -->
  <div class="section">
    <h2>Реєстрація</h2>
    <input type="text" id="regUsername" placeholder="Ім'я користувача">
    <input type="password" id="regPassword" placeholder="Пароль">
    <button onclick="register()">Зареєструватися</button>

    <h2>Авторизація</h2>
    <input type="text" id="loginUsername" placeholder="Ім'я користувача">
    <input type="password" id="loginPassword" placeholder="Пароль">
    <button onclick="login()">Увійти</button>

    <h2>Профіль</h2>
    <button onclick="getProfile()">Переглянути профіль</button>
    <div id="profileInfo"></div>
  </div>

  <!-- Swagger UI -->
  <div class="section">
    <h2>API документація</h2>
    <div id="swagger-ui"></div>
  </div>

  <!-- Swagger UI JS -->
  <script src="https://unpkg.com/swagger-ui-dist/swagger-ui-bundle.js"></script>
  <script src="https://unpkg.com/swagger-ui-dist/swagger-ui-standalone-preset.js"></script>
  <script>
    window.onload = function() {
      const ui = SwaggerUIBundle({
        url: "/swagger/swagger.yaml", // шлях до твого swagger.yaml/json у проекті
        dom_id: '#swagger-ui',
        presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
        layout: "BaseLayout"
      });
      window.ui = ui;
    };
  </script>

  <script>
    let systemsData = [];
    let currentSort = { column: null, asc: true };

    async function loadSystems() {
      const res = await fetch('/systems');
      systemsData = await res.json();
      renderTable();
    }

    function renderTable() {
      const tbody = document.querySelector('#systemsTable tbody');
      tbody.innerHTML = '';
      systemsData.forEach(sys => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${sys.id}</td>
          <td><input value="${sys.name}" id="name-${sys.id}"></td>
          <td><input value="${sys.source}" id="source-${sys.id}"></td>
          <td><input value="${sys.state}" id="state-${sys.id}"></td>
          <td>
            <button onclick="updateSystem(${sys.id})">Оновити</button>
            <button onclick="deleteSystem(${sys.id})">Видалити</button>
          </td>
        `;
        tbody.appendChild(row);
      });
    }

    function sortTable(column) {
      if (currentSort.column === column) {
        currentSort.asc = !currentSort.asc;
      } else {
        currentSort.column = column;
        currentSort.asc = true;
      }
      systemsData.sort((a, b) => {
        if (a[column] < b[column]) return currentSort.asc ? -1 : 1;
        if (a[column] > b[column]) return currentSort.asc ? 1 : -1;
        return 0;
      });
      renderTable();
    }

    async function deleteSystem(id) {
      await fetch('/systems/delete?id=' + id, { method: 'DELETE' });
      loadSystems();
    }

    async function updateSystem(id) {
      const sys = {
        name: document.getElementById('name-' + id).value,
        source: document.getElementById('source-' + id).value,
        state: document.getElementById('state-' + id).value
      };
      const res = await fetch('/systems/update?id=' + id, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(sys)
      });
      if (res.ok) {
        loadSystems();
      } else {
        const err = await res.json();
        alert("Помилка: " + err.error);
      }
    }

    document.getElementById('addBtn').addEventListener('click', async () => {
      const sys = {
        name: document.getElementById('name').value,
        source: document.getElementById('source').value,
        state: document.getElementById('state').value
      };
      const res = await fetch('/systems/create', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(sys)
      });
      if (res.ok) {
        document.getElementById('createForm').reset();
        loadSystems();
      } else {
        const err = await res.json();
        alert("Помилка: " + err.error);
      }
    });

    // Реєстрація
    async function register() {
      const user = {
        username: document.getElementById('regUsername').value,
        password: document.getElementById('regPassword').value
      };
      const res = await fetch('/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(user)
      });
      const data = await res.json();
      alert(data.message || data.error);
    }

    // Логін
    async function login() {
      const user = {
        username: document.getElementById('loginUsername').value,
        password: document.getElementById('loginPassword').value
      };
      const res = await fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(user)
      });
      const data = await res.json();
      alert(data.message || data.error);
    }

    // Профіль
    async function getProfile() {
      const res = await fetch('/profile');
      const data = await res.json();
      if (data.username) {
        document.getElementById('profileInfo').innerText = "Ви увійшли як: " + data.username;
      } else {
        alert(data.error);
      }
    }

    loadSystems();
  </script>
</body>
</html>
